<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIまなびば｜AI活用学習ハブ</title>
<style>
  :root {
    --bg: #FBF7F5;
    --surface: #FFFFFF;
    --ink: #33272B;
    --ink-soft: #6E5A61;
    --line: #EBDCDF;
    --momo: #D9536F;
    --momo-deep: #B93A55;
    --momo-soft: #FBE9ED;
    --star: #C9902E;

    --cat-kyomu: #4A6FA5;
    --cat-kyomu-soft: #EAF0F8;
    --cat-jugyo: #4E8A57;
    --cat-jugyo-soft: #E9F3EA;
    --cat-blog: #B97F24;
    --cat-blog-soft: #F8F0E1;
    --cat-note: #D9536F;
    --cat-note-soft: #FBE9ED;

    --shadow: 0 1px 2px rgba(51, 39, 43, 0.06), 0 4px 16px rgba(51, 39, 43, 0.07);
    --shadow-hover: 0 2px 4px rgba(51, 39, 43, 0.08), 0 10px 28px rgba(51, 39, 43, 0.12);

    --font-display: "Hiragino Maru Gothic ProN", "HG Maru Gothic M-PRO", "Yu Gothic UI", "Meiryo", sans-serif;
    --font-body: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #221C1F;
      --surface: #2C2529;
      --ink: #F2E9EB;
      --ink-soft: #BCA9B0;
      --line: #47393F;
      --momo: #F08CA0;
      --momo-deep: #F4A5B5;
      --momo-soft: #43303A;
      --star: #E0B25E;

      --cat-kyomu: #8FB0DC;
      --cat-kyomu-soft: #2C3542;
      --cat-jugyo: #85BD8D;
      --cat-jugyo-soft: #2B3A2E;
      --cat-blog: #D9A959;
      --cat-blog-soft: #3E362A;
      --cat-note: #F08CA0;
      --cat-note-soft: #43303A;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.3);
      --shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.35), 0 10px 28px rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg: #221C1F;
    --surface: #2C2529;
    --ink: #F2E9EB;
    --ink-soft: #BCA9B0;
    --line: #47393F;
    --momo: #F08CA0;
    --momo-deep: #F4A5B5;
    --momo-soft: #43303A;
    --star: #E0B25E;
    --cat-kyomu: #8FB0DC;
    --cat-kyomu-soft: #2C3542;
    --cat-jugyo: #85BD8D;
    --cat-jugyo-soft: #2B3A2E;
    --cat-blog: #D9A959;
    --cat-blog-soft: #3E362A;
    --cat-note: #F08CA0;
    --cat-note-soft: #43303A;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.3);
    --shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.35), 0 10px 28px rgba(0, 0, 0, 0.4);
  }

  :root[data-theme="light"] {
    --bg: #FBF7F5;
    --surface: #FFFFFF;
    --ink: #33272B;
    --ink-soft: #6E5A61;
    --line: #EBDCDF;
    --momo: #D9536F;
    --momo-deep: #B93A55;
    --momo-soft: #FBE9ED;
    --star: #C9902E;
    --cat-kyomu: #4A6FA5;
    --cat-kyomu-soft: #EAF0F8;
    --cat-jugyo: #4E8A57;
    --cat-jugyo-soft: #E9F3EA;
    --cat-blog: #B97F24;
    --cat-blog-soft: #F8F0E1;
    --cat-note: #D9536F;
    --cat-note-soft: #FBE9ED;
    --shadow: 0 1px 2px rgba(51, 39, 43, 0.06), 0 4px 16px rgba(51, 39, 43, 0.07);
    --shadow-hover: 0 2px 4px rgba(51, 39, 43, 0.08), 0 10px 28px rgba(51, 39, 43, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }

  /* ---------- ヘッダー ---------- */
  .hero {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px 32px;
    padding: 24px 28px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }

  .hero-text { flex: 1 1 320px; }

  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--momo);
  }

  .hero h1 {
    font-family: var(--font-display);
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: 0.02em;
    text-wrap: balance;
    margin-top: 4px;
  }

  .hero h1 .accent { color: var(--momo); }

  .hero p.lead {
    margin-top: 8px;
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 34em;
  }

  /* 新着のお知らせボックス */
  .stat-box {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 22px;
    background: var(--momo-soft);
    border-radius: 16px;
  }
  .stat-num {
    font-family: var(--font-display);
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
    color: var(--momo);
    font-variant-numeric: tabular-nums;
  }
  .stat-text .stat-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 14px;
  }
  .stat-text .stat-sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  /* ---------- ツールバー ---------- */
  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 24px 0 20px;
  }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .filter-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    width: 52px;
    flex-shrink: 0;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    flex: 1 1 auto;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .chip:hover { border-color: var(--momo); }
  .chip[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  .chip .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--dot, var(--ink-soft));
  }
  .chip .star { color: var(--star); }
  .chip[aria-pressed="true"] .star { color: inherit; }
  .chip .n {
    font-variant-numeric: tabular-nums;
    opacity: 0.65;
    font-weight: 700;
  }

  .search {
    flex: 0 1 240px;
    min-width: 180px;
    margin-left: auto;
    position: relative;
  }
  .search input {
    width: 100%;
    padding: 9px 14px 9px 38px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
  }
  .search input::placeholder { color: var(--ink-soft); }
  .search input:focus {
    outline: 2px solid var(--momo);
    outline-offset: 1px;
    border-color: transparent;
  }
  .search svg {
    position: absolute;
    left: 13px; top: 50%;
    transform: translateY(-50%);
    color: var(--ink-soft);
  }

  /* ---------- カードグリッド ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 16px;
  }

  .card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .cat-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: var(--chip-bg);
    color: var(--chip-fg);
  }
  .cat-chip .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .badge-new {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--momo);
    border: 1.5px solid var(--momo);
    border-radius: 999px;
    padding: 1px 8px;
  }

  .card-side {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .stars {
    color: var(--star);
    font-size: 13px;
    letter-spacing: 0.08em;
  }
  .duration {
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .card h3 {
    font-family: var(--font-display);
    font-size: 16.5px;
    font-weight: 800;
    line-height: 1.45;
    text-wrap: balance;
  }

  .card p.desc {
    font-size: 13px;
    color: var(--ink-soft);
    flex-grow: 1;
  }

  .card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 15px;
    border-radius: 10px;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: filter 0.15s, background 0.15s;
  }
  .btn:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--momo);
    outline-offset: 2px;
  }
  .btn-primary {
    background: var(--momo);
    color: #fff;
  }
  :root[data-theme="dark"] .btn-primary { color: #2A1218; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .btn-primary { color: #2A1218; }
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary {
    background: transparent;
    border-color: var(--line);
    color: var(--ink);
  }
  .btn-secondary:hover { border-color: var(--momo); color: var(--momo); }

  .btn svg { flex-shrink: 0; }

  /* 空の状態 */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-text">
      <span class="hero-eyebrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 3c1 2.5 3 4 5.5 4-1 2-1 4.5.5 6.5-2.5 0-4.5 1.5-5.5 4-1-2.5-3-4-5.5-4 1.5-2 1.5-4.5.5-6.5C9 7 11 5.5 12 3z"/>
        </svg>
        AI LEARNING HUB
      </span>
      <h1>AI<span class="accent">まなびば</span></h1>
      <p class="lead">教務も授業も、AIでちょっとラクに、ちょっと楽しく。動画を見たら、実践結果をフォームから送ってくださいね。</p>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="new-count">0</div>
      <div class="stat-text">
        <div class="stat-title">2週間以内の新着</div>
        <div class="stat-sub">全<span id="total-count">0</span>本のコンテンツを公開中</div>
      </div>
    </div>
  </header>

  <nav class="toolbar" aria-label="コンテンツの絞り込み">
    <div class="filter-row">
      <span class="filter-label">タグ</span>
      <div class="chips" id="cat-chips"></div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input type="search" id="search" placeholder="キーワードで探す" aria-label="キーワードで探す">
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">難易度</span>
      <div class="chips" id="lvl-chips"></div>
    </div>
  </nav>

  <main class="grid" id="grid"></main>

  <footer>AIまなびば ／ 新しいコンテンツには2週間 NEW マークがつきます</footer>
</div>

<script>
/* =========================================================
   ★ コンテンツはここを編集してください ★

   1件につき { ... } を1つ書きます。増やすときはコピーして追記。

   id:          他とかぶらない文字なら何でもOK
   category:    "kyomu"(教務×AI動画) / "jugyo"(授業×AI動画) /
                "blog"(iportal記事) / "note"(note記事)
   title:       タイトル
   description: ひとこと説明
   level:       難易度。1 / 2 / 3 のどれか(星の数になります)
   duration:    動画の長さ(記事なら "" でOK)
   url:         動画 or 記事のURL
   formUrl:     実践報告のMicrosoft FormsのURL(動画のみ。記事は "" でOK)
   date:        追加した日。この日から2週間 NEW マークが自動でつきます
   ========================================================= */
const CONTENTS = [
  // --- 教務に使えるAI活用動画(サンプル。URLを差し替えてください) ---
  {
    id: "kyomu-01",
    category: "kyomu",
    title: "Copilotで保護者向けのお便りを時短作成",
    description: "文面のたたき台をAIに作ってもらい、確認と手直しだけで仕上げる流れを紹介します。",
    level: 1,
    duration: "8分",
    url: "",
    formUrl: "",
    date: "2026-07-10",
  },
  {
    id: "kyomu-02",
    category: "kyomu",
    title: "アンケート集計をAIでまるっと自動化",
    description: "行事後アンケートの自由記述を、AIで分類・要約するテクニックです。",
    level: 2,
    duration: "10分",
    url: "",
    formUrl: "",
    date: "2026-06-20",
  },

  // --- 授業に使えるAI活用動画(サンプル。URLを差し替えてください) ---
  {
    id: "jugyo-01",
    category: "jugyo",
    title: "授業スライドをAIと10分で作る",
    description: "単元名を伝えるだけで構成案からスライドまで。仕上げのコツも解説します。",
    level: 1,
    duration: "12分",
    url: "",
    formUrl: "",
    date: "2026-07-05",
  },
  {
    id: "jugyo-02",
    category: "jugyo",
    title: "小テストと解説をAIで自動生成",
    description: "教科書の範囲を指定して、難易度別の小テストを作る方法です。",
    level: 3,
    duration: "9分",
    url: "",
    formUrl: "",
    date: "2026-06-15",
  },

  // --- iportalの記事(サンプル。URLを差し替えてください) ---
  {
    id: "blog-01",
    category: "blog",
    title: "今月のAI活用事例まとめ",
    description: "校内で実際にあった活用事例を集めました。まずはマネから始めましょう。",
    level: 1,
    duration: "",
    url: "",
    formUrl: "",
    date: "2026-07-01",
  },

  // --- note記事(サンプル。URLを差し替えてください) ---
  {
    id: "note-01",
    category: "note",
    title: "AIと働く1日のリアルなスケジュール",
    description: "朝の準備から放課後まで、どこでAIを使っているかを正直に書きました。",
    level: 1,
    duration: "",
    url: "",
    formUrl: "",
    date: "2026-06-28",
  },
];

/* タグの表示名と色(通常は編集不要) */
const CATEGORIES = {
  kyomu: { label: "教務×AI 動画", cssVar: "--cat-kyomu" },
  jugyo: { label: "授業×AI 動画", cssVar: "--cat-jugyo" },
  blog:  { label: "iportal記事",  cssVar: "--cat-blog" },
  note:  { label: "note記事",     cssVar: "--cat-note" },
};

/* NEWマークを表示する日数 */
const NEW_DAYS = 14;

/* ========== ここから下はアプリ本体(編集不要) ========== */
let currentCat = "all";
let currentLevel = 0; // 0 = すべて
let currentQuery = "";

const grid = document.getElementById("grid");

function isVideo(item) { return item.category === "kyomu" || item.category === "jugyo"; }

function isNew(item) {
  const added = new Date(item.date + "T00:00:00");
  return (Date.now() - added.getTime()) / 86400000 <= NEW_DAYS;
}

function starText(level) { return "★".repeat(level); }

function catColor(cat, soft) {
  return `var(${CATEGORIES[cat].cssVar}${soft ? "-soft" : ""})`;
}

function makeChip({ pressed, dotVar, star, label, count, onClick }) {
  const btn = document.createElement("button");
  btn.className = "chip";
  btn.type = "button";
  btn.setAttribute("aria-pressed", String(pressed));
  if (dotVar) btn.style.setProperty("--dot", `var(${dotVar})`);
  btn.innerHTML =
    (dotVar ? '<span class="dot"></span>' : "") +
    (star ? `<span class="star">${star}</span>` : "") +
    `<span>${label}</span>` +
    (count != null ? `<span class="n">${count}</span>` : "");
  btn.addEventListener("click", onClick);
  return btn;
}

function renderCatChips() {
  const el = document.getElementById("cat-chips");
  const counts = {};
  for (const item of CONTENTS) counts[item.category] = (counts[item.category] || 0) + 1;

  el.innerHTML = "";
  el.appendChild(makeChip({
    pressed: currentCat === "all", label: "すべて", count: CONTENTS.length,
    onClick: () => { currentCat = "all"; renderAll(); },
  }));
  for (const [key, cat] of Object.entries(CATEGORIES)) {
    el.appendChild(makeChip({
      pressed: currentCat === key, dotVar: cat.cssVar, label: cat.label, count: counts[key] || 0,
      onClick: () => { currentCat = key; renderAll(); },
    }));
  }
}

function renderLevelChips() {
  const el = document.getElementById("lvl-chips");
  el.innerHTML = "";
  el.appendChild(makeChip({
    pressed: currentLevel === 0, label: "すべて",
    onClick: () => { currentLevel = 0; renderAll(); },
  }));
  for (const lv of [1, 2, 3]) {
    const count = CONTENTS.filter((c) => c.level === lv).length;
    el.appendChild(makeChip({
      pressed: currentLevel === lv, star: starText(lv), label: `難易度${lv}`, count,
      onClick: () => { currentLevel = lv; renderAll(); },
    }));
  }
}

function actionButton(href, primary, iconPath, text) {
  const disabled = !href;
  const style = disabled ? ' style="opacity:0.45;pointer-events:none;"' : "";
  const title = disabled ? ' title="URLが未設定です"' : "";
  return `<a class="btn ${primary ? "btn-primary" : "btn-secondary"}" href="${href || "#"}"
    target="_blank" rel="noopener"${style}${title}>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${iconPath}</svg>
    ${disabled ? text + "(準備中)" : text}</a>`;
}

const ICON_PLAY = '<path d="M7 4.5v15l13-7.5z"/>';
const ICON_FORM = '<path d="M4 3h16v18H4z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 8h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>';
const ICON_BOOK = '<path d="M4 4h7v16H4zM13 4h7v16h-7z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>';

function renderGrid() {
  const q = currentQuery.trim().toLowerCase();
  const items = CONTENTS.filter((item) => {
    if (currentCat !== "all" && item.category !== currentCat) return false;
    if (currentLevel !== 0 && item.level !== currentLevel) return false;
    if (q && !(item.title + item.description).toLowerCase().includes(q)) return false;
    return true;
  });

  grid.innerHTML = "";

  if (items.length === 0) {
    grid.innerHTML = `<div class="empty">見つかりませんでした。キーワードや絞り込みを変えてみてください。</div>`;
    return;
  }

  for (const item of items) {
    const video = isVideo(item);
    const card = document.createElement("article");
    card.className = "card";

    const buttons = video
      ? actionButton(item.url, true, ICON_PLAY, "動画を見る") +
        actionButton(item.formUrl, false, ICON_FORM, "実践報告フォーム")
      : actionButton(item.url, true, ICON_BOOK, "記事を読む");

    card.innerHTML = `
      <div class="card-meta">
        <span class="cat-chip" style="--chip-bg:${catColor(item.category, true)};--chip-fg:${catColor(item.category)}">
          <span class="dot"></span>${CATEGORIES[item.category].label}
        </span>
        ${isNew(item) ? '<span class="badge-new">NEW</span>' : ""}
        <span class="card-side">
          <span class="stars" aria-label="難易度${item.level}" title="難易度${item.level}">${starText(item.level)}</span>
          ${item.duration ? `<span class="duration">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2" stroke-linecap="round"></path>
            </svg>${item.duration}</span>` : ""}
        </span>
      </div>
      <h3>${item.title}</h3>
      <p class="desc">${item.description}</p>
      <div class="card-actions">${buttons}</div>`;

    grid.appendChild(card);
  }
}

function renderStats() {
  document.getElementById("total-count").textContent = CONTENTS.length;
  document.getElementById("new-count").textContent = CONTENTS.filter(isNew).length;
}

function renderAll() {
  renderCatChips();
  renderLevelChips();
  renderGrid();
}

document.getElementById("search").addEventListener("input", (e) => {
  currentQuery = e.target.value;
  renderGrid();
});

renderAll();
renderStats();
</script>
</body>
</html>
